name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://gss_iot_v3:gss_iot_v3@127.0.0.1:5432/gss_iot_v3
  GSS_SUPER_ADMIN_EMAIL: ci-admin@example.com
  GSS_SUPER_ADMIN_PASSWORD: ci-only-super-admin-password
  JWT_ACCESS_SECRET: ci-only-access-secret-that-is-at-least-32-characters
  JWT_REFRESH_SECRET: ci-only-refresh-secret-that-is-at-least-32-characters
  MQTT_BROKER_URL: mqtt://mqtt.invalid:1883
  MQTT_ENABLED: "false"
  MQTT_FAKE_ACK: "true"
  MQTT_TOPIC_BASE: GSSIOT/ci
  NODE_ENV: test

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api prisma:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm i18n:audit
      - run: pnpm test
      - run: pnpm build

  api-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gss_iot_v3
          POSTGRES_PASSWORD: gss_iot_v3
          POSTGRES_USER: gss_iot_v3
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gss_iot_v3 -d gss_iot_v3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api prisma:generate
      - run: pnpm --filter api test:e2e

  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e -- bootstrap.spec.ts

  container-build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          push: false
          tags: gss-iot-v3-api:ci
      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VITE_API_BASE_URL=https://api.invalid
            VITE_AUTH_CSRF_COOKIE_NAME=gss_csrf
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: gss-iot-v3-web:ci
      - name: Validate production Compose
        run: docker compose --env-file deploy/env/release.env.example --file docker-compose.production.yml config --quiet
