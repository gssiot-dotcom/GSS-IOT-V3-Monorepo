services:
  postgres:
    image: postgres:16-alpine
    container_name: gss-iot-v3-postgres
    environment:
      POSTGRES_DB: gss_iot_v3
      POSTGRES_PASSWORD: gss_iot_v3
      POSTGRES_USER: gss_iot_v3
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gss_iot_v3 -d gss_iot_v3"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gss-iot-v3-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mqtt:
    image: eclipse-mosquitto:2
    container_name: gss-iot-v3-mqtt
    ports:
      - "1883:1883"
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]

volumes:
  postgres-data:
  redis-data:
