# Local development infrastructure only. Production uses
# docker-compose.production.yml with an external DB EC2 and MQTT broker.
services:
  postgres:
    image: postgres:16-alpine
    container_name: gss-iot-v3-postgres
    environment:
      POSTGRES_DB: gss_iot_v3
      POSTGRES_PASSWORD: gss_iot_v3
      POSTGRES_USER: gss_iot_v3
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gss_iot_v3 -d gss_iot_v3"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
